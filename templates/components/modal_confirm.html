<!-- components/modal_confirm.html — Всплывающее окно подтверждения удаления.
     Спрашивает «Вы уверены?» и предупреждает, что история переписки будет удалена.
     Кнопки «Отмена» и «Удалить». -->
<div class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" id="confirm-modal">
    <div class="bg-white p-6 rounded shadow-lg w-96">
        <h3 class="text-lg font-bold mb-2">Подтверждение</h3>
        <p class="text-sm text-gray-600 mb-4">Вы уверены? История переписки будет удалена безвозвратно.</p>
        <div class="flex justify-end gap-2">
            <button onclick="document.getElementById('confirm-modal').classList.add('hidden')"
                    class="px-3 py-1 rounded border">Отмена</button>
            <button class="px-3 py-1 rounded bg-red-600 text-white">Удалить</button>
        </div>
    </div>
</div>
