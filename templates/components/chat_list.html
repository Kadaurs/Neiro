<!-- путь: templates/components/chat_list.html -->
<div class="text-xs uppercase text-gray-500 mt-2 mb-1">Личные чаты</div>
{% if personal_chats %}
    {% for c in personal_chats %}
    <a href="/chats/{{ c.id }}" title="{{ c.title }}"
       class="block truncate text-sm text-gray-200 hover:text-white py-1">{{ c.title }}</a>
    {% endfor %}
{% else %}
    <p class="text-xs text-gray-500">Нет личных чатов</p>
{% endif %}

<div class="text-xs uppercase text-gray-500 mt-3 mb-1">Командные чаты</div>
{% if team_chats %}
    {% for c in team_chats %}
    <a href="/chats/{{ c.id }}" title="{{ c.title }}"
       class="block truncate text-sm text-gray-200 hover:text-white py-1">{{ c.title }}</a>
    {% endfor %}
{% else %}
    <p class="text-xs text-gray-500">Нет командных чатов</p>
{% endif %}
