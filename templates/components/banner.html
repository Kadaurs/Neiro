<!-- components/banner.html — Жёлтый баннер-предупреждение.
     Показывается, когда сервис генерации ответов недоступен (is_active = False).
     Отдельный файл, чтобы можно было вставить баннер на любую страницу. -->
{% if not is_active %}
<div class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-800 p-3 rounded mb-3">
    {{ banner_text or 'Сервис генерации ответов временно недоступен, обратитесь к администратору' }}
</div>
{% endif %}
