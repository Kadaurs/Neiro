<!DOCTYPE html>
<!-- login.html — Страница входа.
     Форма с полями «Логин» и «Пароль» и кнопкой «Войти». Показывается неавторизованным. -->
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход — Neuro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<form method="post" action="/login" class="bg-white p-8 rounded shadow w-96 space-y-4" data-testid="form-login">
    <h1 class="text-2xl font-bold text-center">Neuro</h1>
    {% if error %}<div class="text-red-500 text-sm" data-testid="error-message-login">{{ error }}</div>{% endif %}
    <div>
        <label class="block text-sm mb-1">Логин</label>
        <input name="email" required class="w-full border p-2 rounded" placeholder="admin@local" data-testid="input-email-login">
    </div>
    <div>
        <label class="block text-sm mb-1">Пароль</label>
        <input name="password" type="password" required minlength="6" class="w-full border p-2 rounded" data-testid="input-password-login">
    </div>
    <button class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700" data-testid="btn-submit-login">Войти</button>
</form>d
</body>
</html>
